
name: Deploy Kök Tengri

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: koktengri-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to koktengri.org
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: fileinfo
          coverage: none

      - name: Validate PHP syntax
        run: |
          set -e
          find app database routes -type f -name '*.php' -print0 |
            xargs -0 -n1 php -l

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.KOKTENGRI_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.KOKTENGRI_SSH_KNOWN_HOSTS }}
        run: |
          set -eu

          test -n "$SSH_PRIVATE_KEY" || {
            echo "Missing KOKTENGRI_SSH_PRIVATE_KEY secret"
            exit 1
          }

          test -n "$SSH_KNOWN_HOSTS" || {
            echo "Missing KOKTENGRI_SSH_KNOWN_HOSTS secret"
            exit 1
          }

          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"

          # Önce Base64 olarak çözmeyi dene.
          if printf '%s' "$SSH_PRIVATE_KEY" |
              base64 --decode > "$HOME/.ssh/id_ed25519" 2>/dev/null; then
            chmod 600 "$HOME/.ssh/id_ed25519"

            if ! ssh-keygen -y -f "$HOME/.ssh/id_ed25519" \
                > /dev/null 2>&1; then
              echo "Decoded SSH private key is invalid."
              exit 1
            fi
          else
            # Secret doğrudan OpenSSH private key ise kullan.
            printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
            chmod 600 "$HOME/.ssh/id_ed25519"

            if ! ssh-keygen -y -f "$HOME/.ssh/id_ed25519" \
                > /dev/null 2>&1; then
              echo "SSH private key is invalid. Check the GitHub Secret."
              exit 1
            fi
          fi

          echo "SSH private key validated."

          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Deploy over SSH
        env:
          SSH_HOST: ${{ secrets.KOKTENGRI_SSH_HOST }}
          SSH_USER: ${{ secrets.KOKTENGRI_SSH_USER }}
        run: |
          set -eu

          test -n "$SSH_HOST" || {
            echo "Missing KOKTENGRI_SSH_HOST secret"
            exit 1
          }

          test -n "$SSH_USER" || {
            echo "Missing KOKTENGRI_SSH_USER secret"
            exit 1
          }

          ssh \
            -i "$HOME/.ssh/id_ed25519" \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "$SSH_USER@$SSH_HOST" 'bash -se' <<'REMOTE'
          set -euo pipefail

          cd /www/wwwroot/koktengri.org

          echo "Pulling latest main branch..."
          git pull --ff-only origin main

          export COMPOSER_ALLOW_SUPERUSER=1

          echo "Installing production dependencies..."
          /www/server/php/84/bin/php \
            -d extension=/www/server/php/84/lib/php/extensions/no-debug-non-zts-20240924/fileinfo.so \
            /usr/bin/composer install \
            --no-dev \
            --optimize-autoloader \
            --no-interaction \
            --prefer-dist

          echo "Running database migrations..."
          /www/server/php/84/bin/php \
            -d extension=/www/server/php/84/lib/php/extensions/no-debug-non-zts-20240924/fileinfo.so \
            artisan migrate --force

          echo "Clearing and rebuilding Laravel caches..."
          /www/server/php/84/bin/php \
            -d extension=/www/server/php/84/lib/php/extensions/no-debug-non-zts-20240924/fileinfo.so \
            artisan optimize:clear

          echo "Updating Filament..."
          /www/server/php/84/bin/php \
            -d extension=/www/server/php/84/lib/php/extensions/no-debug-non-zts-20240924/fileinfo.so \
            artisan filament:upgrade

          echo "Deployment commands completed."
          REMOTE
